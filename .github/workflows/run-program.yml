# 1. 워크플로우(전체 흐름)의 이름입니다. 원하는 대로 바꿀 수 있습니다.
name: Run Python Script Automatically

# 2. 언제 실행할지(이벤트/트리거) 결정합니다.
on:
  schedule:
    # 매일 한국 시간(KST) 오전 5시 (세계 표준시 UTC 20:00)에 실행 마법의 명령어
    - cron: '40 09 * * *'
  workflow_dispatch: # 수동 실행 버튼도 유지합니다.

# 3. 구체적으로 어떤 원격 컴퓨터에서 어떻게 실행할지 적습니다.
permissions:
  contents: write
  
jobs:
  build:
    # GitHub이 제공하는 최신 우분투 리눅스 가상 가상 환경(컴퓨터)을 빌립니다.
    runs-on: ubuntu-latest

    steps:
    # (1) 내가 올린 소스 코드를 가상 컴퓨터로 가져옵니다.
    - name: Check out repository code
      uses: actions/checkout@v5

    # (2) 가상 컴퓨터에 파이썬을 설치합니다.
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10' # 사용할 파이썬 버전을 지정합니다.

    # (3) 프로그램 실행에 필요한 외부 라이브러리를 설치합니다.
    # (beautifulsoup4, pandas, openpyxl 등이 필요하다면 여기에 적어줍니다.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl beautifulsoup4 finance-datareader pykrx

    # (4) 마침내 내가 올린 파이썬 프로그램을 실행합니다!
    - name: Run script
      run: python 20_collect_ETF_info.py   # 여기에 실행할 파이썬 파일 이름을 적어주세요.
      
    # [여기가 핵심!] 생성된 엑셀 파일을 내 저장소(Repository)로 업로드합니다.
    - name: Commit and Push changes
      run: |
        # 가상 컴퓨터의 깃(Git) 유저 설정을 합니다.
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # 새로 생성되거나 변경된 모든 엑셀(.xlsx) 파일을 무대에 올립니다.
        git add *.xlsx
        
        # 변경된 파일이 있을 때만 커밋하고 푸시합니다. (파일이 없으면 에러 없이 통과)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ETF Excel Data" && git push)
